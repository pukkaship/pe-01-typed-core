name: Module feedback
description: Tell us what broke unexpectedly or where you got stuck (5 minutes).
title: "[Module 1 feedback] "
labels: ["feedback"]
body:
  - type: input
    id: module
    attributes:
      label: Which module
      value: "Module 1 — pe-01-typed-core"
    validations:
      required: true
  - type: textarea
    id: unexpected
    attributes:
      label: One thing that broke unexpectedly
      description: NOT an intentional bug — something the repo itself should not have done.
    validations:
      required: false
  - type: textarea
    id: stuck
    attributes:
      label: Where did you hit the 4-hour stuck threshold (if you did)?
    validations:
      required: false
  - type: dropdown
    id: ai-review
    attributes:
      label: Was the AI PR review comment useful?
      options:
        - "Useful and specific"
        - "Generic / not helpful"
        - "I did not see one"
    validations:
      required: false
